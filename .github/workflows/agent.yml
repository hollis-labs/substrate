# Checks for the agent module only; runs when its files (or the shared module workflow) change.
name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/_module.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/_module.yml"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/_module.yml
    with:
      module: agent
      race: true
