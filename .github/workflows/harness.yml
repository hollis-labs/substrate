# Checks for the harness module only; runs when its files (or the shared module workflow) change.
name: harness

on:
  push:
    branches: [main]
    paths:
      - "harness/**"
      - ".github/workflows/harness.yml"
      - ".github/workflows/_module.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness.yml"
      - ".github/workflows/_module.yml"

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/_module.yml
    with:
      module: harness
      race: true
      # The sandbox tests need a Linux backend; the hosted runner does not ship one.
      sandbox-backend: true

  runner-windows:
    name: runner Windows build and limit contract
    runs-on: windows-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum
      - run: go build ./runner/...
      - run: go vet ./runner/...
      - run: go test ./runner -run '^TestApplyResourceLimits_(ZeroIsNoOp|WindowsUnsupported)$' -count=1
