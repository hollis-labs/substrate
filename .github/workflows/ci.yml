name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway container on the job network
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUBSTRATE_REQUIRE_POSTGRES: "1"
      SUBSTRATE_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # public-hygiene scan reads history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: pins match the BOM (go.mod, this workflow)
        run: go run ./cmd/substrate pins check
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: public hygiene (secrets, hosts, private paths; tree and history)
        run: python3 scripts/scan-public --ref HEAD
