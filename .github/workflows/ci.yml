name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/hollis-labs/*
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v7
        with: { version: v2.11.4 }
