# Checks for the mesh module only; runs when its files (or the shared module workflow) change.
name: mesh

on:
  push:
    branches: [main]
    paths:
      - "mesh/**"
      - ".github/workflows/mesh.yml"
      - ".github/workflows/_module.yml"
  pull_request:
    paths:
      - "mesh/**"
      - ".github/workflows/mesh.yml"
      - ".github/workflows/_module.yml"

permissions:
  contents: read

concurrency:
  group: mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/_module.yml
    with:
      module: mesh
      race: true
