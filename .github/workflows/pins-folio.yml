name: pins-folio
# Folio's platform-pins.yaml is a generated mirror of the BOM, and every pinned
# kit version must be published on npm. Both need the network and another
# party's state, so they run nightly instead of on every PR.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./cmd/substrate pins check --npm --folio https://raw.githubusercontent.com/hollis-labs/tools/main/folio/platform-pins.yaml
