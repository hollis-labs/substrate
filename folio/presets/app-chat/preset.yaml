folio_version: "0.1"
id: app-chat
version: 0.1.0
description: Owner-scoped persistent chat on the shared Substrate app shell, with BOM-pinned kit-chat and kit-identity
author: hollis-labs
license: MIT

composes:
  - id: substrate-baseline
    version: ">=0.1,<1.0"
    source: local
    path: ../substrate-baseline
    vars:
      with_chat: "yes"
      with_frontend: "yes"
  - id: substrate-frontend
    version: ">=0.1,<1.0"
    source: local
    path: ../substrate-frontend
    vars:
      with_chat: "yes"

inputs:
  - name: with_chat
    type: string
    default: "yes"
    pattern: "^yes$"
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository, binary and Substrate app name (lowercase, hyphens allowed)
  - name: substrate_version
    type: string
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+([-+.][0-9A-Za-z.+-]*)?$"
    description: The github.com/hollis-labs/substrate version for the go.mod require line. No default.
  - name: kit_app_shell
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/app-shell, exact. No default."
  - name: kit_design_app_runtime
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-app-runtime, exact. No default."
  - name: kit_design_bindings
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-bindings, exact. No default."
  - name: kit_design_components
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-components, exact. No default."
  - name: kit_design_tokens
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-tokens, exact. No default."
  - name: kit_dashboard
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-dashboard, exact. No default."
  - name: kit_plugin_host_ui
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/plugin-host-ui, exact (app-shell depends on it with a range, so it is pinned directly), from the Substrate bom.yaml kits block. No default."

  - name: kit_chat
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-chat, exact from the Substrate BOM. No default."

  - name: kit_cards
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-cards, exact from the Substrate BOM. No default."

  - name: kit_identity
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-identity, exact from the Substrate BOM. No default."

  - name: kit_account
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-account, exact from the Substrate BOM. No default."

files:
  source: ./files
  template_suffix: .tmpl
