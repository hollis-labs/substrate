folio_version: "0.1"
id: agent-dir
version: 0.1.0
description: The standard agent directory for an app with an agent (agents/<name>/ with agent.md and host.yaml, opened by Nanite) — compose, do not render directly
author: hollis-labs
license: MIT
layer_only: true

# A LAYER, composed by the presets whose apps have an agent (Surface pack: surface-desk). It renders the
# convention in github.com/hollis-labs/nanite docs/embedding.md: one directory per agent under agents/,
# named for the agent, holding its authored files. agent.md is a thin agentdef v2 (who the agent is, how it
# uses the app's tools, durable continuity); host.yaml says kind embedded, lifetime application and the
# app's name. No Nanite built-in tool group is turned on: the host opts in.
#
# Nothing in the generated app opens this directory yet; agents/README.md says so. The files are the
# person's once generated: folio sync never writes them.

inputs:
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: The app's name, used as the agent's application_id

files:
  source: ./files
  template_suffix: .tmpl

sync:
  default: prompt
  rules:
    - glob: "agents/**"
      policy: skip
