folio_version: "0.1"
id: surface-ui
version: 0.1.0
description: The Surface interface for an app in its own repository (registry at a pinned tag, theme, raw-control lint, ui verify in CI, agent instructions) — compose, do not render directly
author: hollis-labs
license: MIT
layer_only: true

# A LAYER. surface-app (a plain app: the frame and views) and surface-desk (the desk: windows, the agent
# panel, cards, on a Go server built on Surface) compose it with `kind` set.
#
# What it renders is Surface's set-up for "an app in its own repository" (registry/README.md in
# github.com/hollis-labs/surface): ui.lock.json naming the registry on GitHub at the tag v<surface_version>,
# the stylesheet (Tailwind, then the installed theme), the @/ alias, the lint rule that forbids raw
# controls outside the installed components, `surface-ui verify` in CI, and the agent instructions.
#
# The components are not files of this preset. `make setup` installs them with `surface-ui add`, which
# fetches them from the registry at the tag and records their hashes in ui.lock.json; the app commits them.
# They belong to surface-ui from then on: folio sync never writes ui.lock.json or src/components/**.
#
# Versions: surface_version is the Surface release (one version line: the registry ref is v<it> and every
# @hollis-labs/surface-* package is pinned to it exactly). The other packages are literals taken from
# hollis-labs/surface's package-lock.json at the tag v0.1.0, the versions that release was built and tested
# with; move them with surface_version.

inputs:
  - name: kind
    type: enum
    values: [plain, desk]
    default: plain
    description: Set by the composing preset
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository and package name (lowercase, hyphens allowed); for a desk app also the binary and the app name
  - name: title
    type: string
    default: ""
    pattern: "^[^\\x00-\\x1f\\x7f]*$"
    description: How a person reads the app's name (default from repo_name)
  - name: surface_version
    type: string
    default: "0.1.0"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: The Surface release. The registry is read at the tag v<this>; @hollis-labs/surface-* are pinned to it exactly
  - name: github_owner
    type: string
    default: hollis-labs
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    description: GitHub owner, for a desk app's Go module path
  - name: port
    type: string
    default: "8300"
    pattern: "^[0-9]{4,5}$"
    description: A desk app's loopback port (its server, and the dev server's proxy target)

computed:
  app_title: '{{ if .inputs.title }}{{ .inputs.title }}{{ else }}{{ title (replace "-" " " .inputs.repo_name) }}{{ end }}'
  surface_ref: "v{{ .inputs.surface_version }}"
  env_prefix: '{{ upper (replace "-" "_" .inputs.repo_name) }}'

files:
  source: ./files
  template_suffix: .tmpl

# The installed components and the lock are surface-ui's (make setup, npx surface-ui sync): folio never
# writes them. The stylesheet and the agent instructions are the person's once generated.
sync:
  default: prompt
  rules:
    - glob: "ui.lock.json"
      policy: skip
    - glob: "src/components/**"
      policy: skip
    - glob: "src/index.css"
      policy: skip
    - glob: "README.md"
      policy: skip
