folio_version: "0.1"
id: surface-app
version: 0.1.0
description: A web app on Surface's interface — the @surface registry at a pinned tag, the theme, the frame and a starter view, lint and ui verify
author: hollis-labs
license: MIT

# A plain app: Vite, React and Tailwind with the components installed from the Surface registry, the app frame,
# one starter view and a gallery page (#/gallery). No server. For windows, the agent panel and cards on a Go
# server, use surface-desk.
#
# `make setup` installs the packages and the components (theme, app-frame, button, input, dialog, card);
# `make check` is what CI runs. The views (src/views/**) and the gallery (src/gallery/**) are the person's
# once generated: folio sync never writes them.

composes:
  - id: surface-ui
    version: ">=0.1,<1.0"
    source: local
    path: ../surface-ui
    vars:
      kind: plain

inputs:
  - name: kind
    type: enum
    values: [plain]
    default: plain
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository and package name (lowercase, hyphens allowed)
  - name: title
    type: string
    default: ""
    pattern: "^[^\\x00-\\x1f\\x7f]*$"
    description: How a person reads the app's name (default from repo_name)
  - name: surface_version
    type: string
    default: "0.1.0"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: The Surface release. The registry is read at the tag v<this>; @hollis-labs/surface-* are pinned to it exactly

computed:
  app_title: '{{ if .inputs.title }}{{ .inputs.title }}{{ else }}{{ title (replace "-" " " .inputs.repo_name) }}{{ end }}'

files:
  source: ./files
  template_suffix: .tmpl

sync:
  default: prompt
  rules:
    - glob: "src/views/**"
      policy: skip
    - glob: "src/gallery/**"
      policy: skip
    - glob: "src/App.tsx"
      policy: skip
