folio_version: "0.1"
id: substrate-service
version: 0.1.0
description: Class 2 Substrate service (variant microservice, profile minimal); loopback HTTP daemon, project.yaml, deploy.yaml, Cerberus manifest (Option B), loopback-dev auth guard; composed on go-baseline and substrate-tool-baseline
author: hollis-labs
license: MIT

# Renders <name>.cerberus.yaml (cerberus-project/v1, Option B) beside deploy.yaml.

composes:
  - id: substrate-tool-baseline
    version: ">=0.1,<1.0"
    source: local
    path: ../substrate-tool-baseline
    vars:
      tool_kind: service

inputs:
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository, binary, Substrate app and project id (lowercase, hyphens allowed)
  - name: substrate_version
    type: string
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+([-+.][0-9A-Za-z.+-]*)?$"
    description: The github.com/hollis-labs/substrate version for the go.mod require line. No default.

  - name: http_port
    type: string
    default: "8080"
    pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Loopback port the service listens on
  - name: auth
    type: string
    default: enforce
    pattern: "^(enforce|loopback_open)$"
    description: Default auth mode. loopback_open is dev only and the service refuses a non-loopback bind with it.

files:
  source: ./files
  template_suffix: .tmpl

sync:
  default: prompt
  rules:
    - glob: "README.md"
      policy: three-way
