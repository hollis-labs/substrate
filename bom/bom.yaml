# Substrate BOM: the single place Substrate-specific pins live. An app depends
# on a Substrate version only; this file says what that version pins.
#
# Ownership split (decided 2026-11-02): Folio's platform-pins.yaml is canonical
# for portfolio-wide pins (the Go floor and the `ci` block). The `ci` block here
# mirrors it and must not diverge; scripts/check-bom-drift verifies that against
# a Folio checkout. Everything else (go_min, libs, third_party, kits) is owned
# here.
substrate: v0.0.0-dev
toolchain:
  go_min: "1.26.10"       # Substrate's own minimum (core/store requires it); above the
                          # portfolio floor in Folio's platform-pins.yaml, never below
ci:                       # mirrors Folio platform-pins.yaml ci (canonical there)
  actions_checkout: "v5"
  actions_setup_go: "v6"
  golangci_lint_action: "v7"
  golangci_lint_version: "v2.11.4"
  govulncheck_version: "v1.8.0"
libs:
  github.com/hollis-labs/libs/app/app-host: v0.1.0
  github.com/hollis-labs/libs/core/store: v0.1.0
  github.com/hollis-labs/libs/mcp/plugin-mcp: v0.6.0   # apps are on v0.3-v0.6; v0.6.0 is the train
  github.com/hollis-labs/libs/security/auth: v0.3.0
  github.com/hollis-labs/libs/security/policy: v0.1.0
  github.com/hollis-labs/libs/security/secrets: v0.1.0
  github.com/hollis-labs/libs/security/redact: v0.2.0
third_party:
  github.com/spf13/cobra: v1.10.2   # CLI standard (matches torque, tether, hadron, cerberus)
kits: {}                  # design-kit packages arrive with the gui-shell profile
