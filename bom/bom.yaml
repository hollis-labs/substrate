# Substrate BOM: the single place version pins live. An app depends on a
# Substrate version only; this file says what that version pins.
#
# Ownership (decided 2026-11-02): this is the only hand-edited place. go.mod's
# go directive and requires, the CI workflow's action and lint pins, and Folio's
# platform-pins.yaml (go_floor and ci) are written from it by
# `substrate pins sync [--folio <dir>]` and verified by `substrate pins check`.
toolchain:
  go_floor: "1.26.6"      # portfolio floor, mirrored to Folio (go_floor_1_26_6_everywhere)
  go_min: "1.26.10"       # Substrate's own minimum (core/store requires it); never below go_floor
ci:                       # mirrored to Folio platform-pins.yaml
  actions_checkout: "v5"
  actions_setup_go: "v6"
  golangci_lint_action: "v7"
  golangci_lint_version: "v2.11.4"
  govulncheck_version: "v1.8.0"
libs:
  github.com/hollis-labs/libs/app/app-host: v0.1.0
  github.com/hollis-labs/libs/core/store: v0.1.0
  github.com/hollis-labs/libs/mcp/plugin-mcp: v0.6.0   # apps are on v0.3-v0.6; v0.6.0 is the train
  github.com/hollis-labs/libs/security/auth: v0.3.0
  github.com/hollis-labs/libs/security/policy: v0.1.0
  github.com/hollis-labs/libs/security/secrets: v0.1.0
  github.com/hollis-labs/libs/security/redact: v0.2.0
third_party:
  github.com/spf13/cobra: v1.10.2   # CLI standard (matches torque, tether, hadron, cerberus)
  gopkg.in/yaml.v3: v3.0.1          # manifest and BOM parsing
kits: {}                  # design-kit packages arrive with the gui-shell profile
