# Substrate BOM: the single place version pins live. An app depends on a
# Substrate version only; this file says what that version pins.
#
# Ownership (decided 2026-11-02): this is the only hand-edited place. go.mod's
# go directive and requires, the CI workflow's action and lint pins, and Folio's
# platform-pins.yaml (go_floor and ci) are written from it by
# `substrate pins sync [--folio <dir>]` and verified by `substrate pins check`.
toolchain:
  go_floor: "1.26.11"     # portfolio floor, mirrored to Folio; raised 2026-11-12 for GO-2026-6859 (net/http), fixed in 1.26.11
  go_min: "1.26.11"       # Substrate's own minimum; never below go_floor
ci:                       # mirrored to Folio platform-pins.yaml
  actions_checkout: "v5"
  actions_setup_go: "v6"
  golangci_lint_action: "v7"
  golangci_lint_version: "v2.11.4"
  govulncheck_version: "v1.8.0"
  actions_upload_artifact: "v4"   # build.yml only; not mirrored to Folio
  postgres_image: "postgres:17"   # ci.yml database service; not mirrored to Folio
libs:
  github.com/hollis-labs/libs/app/app-host: v0.1.0
  github.com/hollis-labs/libs/core/store: v0.1.0
  github.com/hollis-labs/libs/core/util: v0.6.0   # queue, scheduler and router packages
  github.com/hollis-labs/libs/mcp/plugin-mcp: v0.6.0   # apps are on v0.3-v0.6; v0.6.0 is the train
  github.com/hollis-labs/libs/security/auth: v0.3.1
  github.com/hollis-labs/libs/security/policy: v0.1.0
  github.com/hollis-labs/libs/security/secrets: v0.1.0
  github.com/hollis-labs/libs/security/redact: v0.2.0
  github.com/hollis-labs/libs/ui/ui-go: v0.1.0
app_libs:                 # libs an app may import that Substrate itself does not require
  github.com/hollis-labs/libs/workflow/engine: v0.2.0
  github.com/hollis-labs/libs/harness/core: v0.16.0
  github.com/hollis-labs/libs/mesh/core: v0.6.0      # Tether client, messaging (Hadron agent sessions)
  github.com/hollis-labs/libs/security/pairing: v0.0.0-20261018164511-e8bfb38b4f31   # device grants and renewable device tokens (Basalisk companion); untagged in libs
  github.com/hollis-labs/libs/llm/core: v0.4.0        # cost, quota, pricing and usage-ledger types (Station llm-gateway)
  github.com/hollis-labs/libs/core/panics: v0.1.0     # recovered-panic refs and the HTTP recovery guard (Conduit)
third_party:
  github.com/spf13/cobra: v1.10.2   # CLI standard (matches torque, tether, hadron, cerberus)
  gopkg.in/yaml.v3: v3.0.1          # manifest and BOM parsing
  golang.org/x/crypto: v0.58.0      # password hashing (identity module)
  golang.org/x/term: v0.47.0        # no-echo password prompt (identity offline bootstrap); the version x/crypto requires
  github.com/modelcontextprotocol/go-sdk: v1.8.0   # MCP stdio transport (go-mcp wraps it)
kits:                     # npm packages (public registry, @hollis-labs); exact versions, all verified published
  "@hollis-labs/design-tokens": 0.5.0
  "@hollis-labs/design-components": 0.5.1
  "@hollis-labs/design-app-runtime": 0.6.0
  "@hollis-labs/design-bindings": 0.3.0
  "@hollis-labs/kit-settings": 0.2.0
  "@hollis-labs/kit-admin": 0.2.0
  "@hollis-labs/kit-cards": 0.3.0      # built for design-bindings ^0.3 (0.2.0 needed ^0.2 and was unpinned)
  "@hollis-labs/kit-chat": 0.8.0       # needs kit-cards ^0.3.0 and design-bindings ^0.3.0; one bindings copy with app-shell 0.11.0
  "@hollis-labs/kit-account": 0.3.0
  "@hollis-labs/kit-identity": 0.1.1   # reads the profile on boot, so identity survives a reload
  "@hollis-labs/kit-observe": 0.1.2
  "@hollis-labs/app-shell": 0.11.0
  "@hollis-labs/kit-dashboard": 0.6.2  # adds the --dash-search-min-height token; renders as 0.6.1 by default
  "@hollis-labs/plugin-host-ui": 0.3.0
  "@hollis-labs/plugin-registry": 0.2.0
kit_exceptions:           # known incoherences between pinned kits that this repo does not control; reported, not hidden
  "@hollis-labs/kit-settings>@hollis-labs/design-tokens": kit-settings 0.2.0 still depends on design-tokens ^0.4; needs a release on 0.5 (kit-admin and plugin-host-ui need kit-settings ^0.2)
  "@hollis-labs/kit-settings>@hollis-labs/design-components": kit-settings 0.2.0 still depends on design-components ^0.4; needs a release on 0.5
